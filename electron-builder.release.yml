appId: dev.axis.desktop
productName: Axis
asar: true
directories:
  output: release
files:
  - desktop/**/*
  - dist/**/*
  - app-dist/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: Axis Code Signing
  forceCodeSigning: true
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - dmg
    - zip
artifactName: ${productName}-mac-${version}-${arch}.${ext}
