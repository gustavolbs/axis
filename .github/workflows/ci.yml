name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install

      - name: Build and test
        run: npm run check

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install

      - name: Build and run full test suite on Windows
        run: npm run check

      - name: Check PowerShell worker scripts syntax
        shell: pwsh
        run: |
          $scripts = @(
            '.\scripts\windows-auth.ps1',
            '.\scripts\windows-firewall.ps1',
            '.\scripts\setup-windows-host.ps1',
            '.\scripts\install-windows-worker-task.ps1',
            '.\scripts\ensure-windows-host.ps1',
            '.\test\windows-auth.ps1',
            '.\test\windows-firewall.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }
          }

      - name: Test Windows worker token stability
        shell: pwsh
        run: .\test\windows-auth.ps1

      - name: Test Windows firewall guard
        shell: pwsh
        run: .\test\windows-firewall.ps1

  macos-desktop:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Validate desktop shell contract
        run: |
          npm run build
          node --check desktop/main.mjs
          node --check scripts/run-desktop.mjs
          npx tsx --test test/desktop-shell.test.ts test/desktop-ui-contract.test.ts

      - name: Reproduce inherited Electron Node-mode contamination
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          output="$(node scripts/run-desktop.mjs --version)"
          echo "$output"
          echo "$output" | grep -q "v44.1.0"

      - name: Package unsigned Local Coder.app, DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:pack:mac

      - name: Verify desktop artifacts
        run: |
          test -n "$(find release -maxdepth 3 -name 'Local Coder.app' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-coder-macos-unsigned
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
