name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install

      - name: Require a new version on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          BASE_VERSION="$(git show "origin/$BASE_REF:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          node scripts/release-metadata.mjs compare "$BASE_VERSION"

      - name: Build and test
        run: npm run check

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install

      - name: Build and run full test suite on Windows
        run: npm run check

      - name: Check PowerShell worker scripts syntax
        shell: pwsh
        run: |
          $scripts = @(
            '.\scripts\windows-auth.ps1',
            '.\scripts\windows-firewall.ps1',
            '.\scripts\setup-windows-host.ps1',
            '.\scripts\install-windows-worker-task.ps1',
            '.\scripts\ensure-windows-host.ps1',
            '.\test\windows-auth.ps1',
            '.\test\windows-firewall.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }
          }

      - name: Test Windows worker token stability
        shell: pwsh
        run: .\test\windows-auth.ps1

      - name: Test Windows firewall guard
        shell: pwsh
        run: .\test\windows-firewall.ps1

  macos-desktop:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Validate desktop shell contract
        run: |
          npm run build
          node --check desktop/bootstrap.mjs
          node --check desktop/main.mjs
          node --check desktop/connection-center.mjs
          node --check scripts/run-desktop.mjs
          node --check scripts/capture-companies-visual.mjs
          node --check scripts/capture-company-scope-visual.mjs
          node --check scripts/capture-connections-visual.mjs
          node --check scripts/capture-api-connection-visual.mjs
          node --check scripts/capture-shared-connection-form-visual.mjs
          node --check scripts/capture-api-key-lifecycle-visual.mjs
          node --check scripts/capture-agent-runtime-ui-visual.mjs
          npx tsx --test test/desktop-shell.test.ts test/desktop-ui-contract.test.ts test/connection-center-desktop-contract.test.ts

      - name: Render Company, Connection, and Agent Runtime states
        run: |
          node scripts/capture-companies-visual.mjs
          node scripts/capture-company-scope-visual.mjs
          node scripts/capture-connections-visual.mjs
          node scripts/capture-api-connection-visual.mjs
          node scripts/capture-shared-connection-form-visual.mjs
          node scripts/capture-api-key-lifecycle-visual.mjs
          node scripts/capture-agent-runtime-ui-visual.mjs

      - name: Upload desktop visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: axis-companies-visual-smoke
          path: |
            visual-artifacts/companies/*.png
            visual-artifacts/connections/*.png
            visual-artifacts/runtime-ui/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Reproduce inherited Electron Node-mode contamination
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          output="$(node scripts/run-desktop.mjs --version)"
          echo "$output"
          echo "$output" | grep -q "v44.1.0"

      - name: Package unsigned Axis.app, DMG and ZIP for Intel and Apple Silicon
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:pack:mac

      - name: Verify desktop artifacts
        run: |
          test -n "$(find release -maxdepth 3 -name 'Axis.app' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'Axis-*-x64.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'Axis-*-arm64.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'Axis-*-x64.zip' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'Axis-*-arm64.zip' -print -quit)"

      - name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axis-macos-unsigned
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
