name: macOS Automatic Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axis-macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Validate release metadata
        id: metadata
        run: |
          set -euo pipefail
          npm run release:validate
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run --silent release:notes > "$RUNNER_TEMP/axis-release-notes.md"
          test -s "$RUNNER_TEMP/axis-release-notes.md"

      - name: Require an unreleased version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump package.json and CHANGELOG.md before merging to main."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi

      - name: Build and test
        run: npm run check

      - name: Require free macOS signing secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MAC_CSC_LINK:-}" || { echo "::error::Missing MAC_CSC_LINK. Run scripts/create-macos-signing-cert.sh and configure the repository secret."; exit 1; }
          test -n "${MAC_CSC_KEY_PASSWORD:-}" || { echo "::error::Missing MAC_CSC_KEY_PASSWORD."; exit 1; }

      - name: Trust and verify the self-signed signing identity
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/axis-signing.p12"
          pem="$RUNNER_TEMP/axis-signing.pem"
          echo "$MAC_CSC_LINK" | base64 --decode > "$p12"

          openssl pkcs12 -in "$p12" -clcerts -nokeys \
            -passin "pass:$MAC_CSC_KEY_PASSWORD" -out "$pem" 2>/dev/null || \
          openssl pkcs12 -legacy -in "$p12" -clcerts -nokeys \
            -passin "pass:$MAC_CSC_KEY_PASSWORD" -out "$pem"

          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$pem"

          scratch="$RUNNER_TEMP/axis-signing-check.keychain"
          security create-keychain -p check "$scratch"
          security unlock-keychain -p check "$scratch"
          security set-keychain-settings "$scratch"
          security import "$p12" -k "$scratch" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k check "$scratch" >/dev/null 2>&1
          security find-identity -v -p codesigning "$scratch"
          security find-identity -v -p codesigning "$scratch" | grep -F 'Axis Code Signing'
          security delete-keychain "$scratch"
          rm -f "$p12" "$pem"

      - name: Build signed Intel and Apple Silicon artifacts
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run desktop:release:mac

      - name: Verify update signature and artifacts
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          expected=(
            "release/Axis-mac-$VERSION-arm64.dmg"
            "release/Axis-mac-$VERSION-x64.dmg"
            "release/Axis-mac-$VERSION-arm64.zip"
            "release/Axis-mac-$VERSION-x64.zip"
          )
          for artifact in "${expected[@]}"; do
            test -f "$artifact" || { echo "::error::Missing release artifact: $artifact"; exit 1; }
          done

          found_app=0
          while IFS= read -r -d '' app_path; do
            found_app=1
            echo "Verifying $app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            dr="$(codesign -d -r- "$app_path" 2>&1 | sed -n 's/^.*designated => //p')"
            echo "designated requirement: $dr"
            case "$dr" in
              *"certificate root = H"*|*"certificate leaf = H"*) ;;
              *cdhash*)
                echo "::error::Ad-hoc signature detected. Automatic updates would break."
                exit 1
                ;;
              *)
                echo "::error::Expected a certificate-pinned designated requirement."
                exit 1
                ;;
            esac
          done < <(find release -maxdepth 3 -type d -name 'Axis.app' -print0)
          test "$found_app" -eq 1 || { echo "::error::No packaged Axis.app found."; exit 1; }

          shasum -a 256 "${expected[@]}" > release/SHA256SUMS.txt
          cp "$RUNNER_TEMP/axis-release-notes.md" release/RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "release/Axis-mac-$VERSION-arm64.dmg" \
            "release/Axis-mac-$VERSION-x64.dmg" \
            "release/Axis-mac-$VERSION-arm64.zip" \
            "release/Axis-mac-$VERSION-x64.zip" \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Axis v$VERSION" \
            --notes-file release/RELEASE_NOTES.md \
            --latest

      - name: Upload workflow backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axis-macos-${{ steps.metadata.outputs.version }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
