name: Apply planning resilience history fix v2

on:
  push:
    branches:
      - fix/planning-resilience-history

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[applied-fix-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-resilience-history

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply targeted source migration
        run: node scripts/apply-planning-history-fix-v2.mjs

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: npm run check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src dashboard scripts/dashboard.mjs test package.json
          git commit -m "fix: harden planning and add execution history [applied-fix-v2]"
          git push origin HEAD:fix/planning-resilience-history
