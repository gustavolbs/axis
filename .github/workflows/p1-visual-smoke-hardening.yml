name: P1 Visual Smoke Hardening

on:
  push:
    branches:
      - test/p1-multicompany-agent-runtime-gate

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p1-visual-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/p1-multicompany-agent-runtime-gate
          fetch-depth: 0

      - name: Apply visual smoke hardening
        run: node scripts/apply-p1-visual-smoke-hardening.mjs

      - name: Commit generated hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align API lifecycle visual smoke with network policy [p1-visual-applied]"
          git push origin HEAD:test/p1-multicompany-agent-runtime-gate
