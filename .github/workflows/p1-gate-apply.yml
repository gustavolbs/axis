name: P1 Gate Apply

on:
  push:
    branches:
      - test/p1-multicompany-agent-runtime-gate

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p1-gate-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate branch
        uses: actions/checkout@v4
        with:
          ref: test/p1-multicompany-agent-runtime-gate
          fetch-depth: 0

      - name: Apply gate hardening and metadata
        run: node scripts/apply-p1-gate.mjs

      - name: Commit generated gate changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: finalize P1 multi-company gate [p1-gate-applied]"
          git push origin HEAD:test/p1-multicompany-agent-runtime-gate
