name: Apply Context-derived Project connections

on:
  push:
    branches:
      - fix/project-chat-connection-scope
    paths:
      - .github/workflows/apply-context-project-connections.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-chat-connection-scope
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Context-derived Project connection semantics
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"{label}: anchor not found")
              return text.replace(old, new, 1)

          # First-class Connection ownership/visibility: Personal is an upstream inference pool.
          path = Path('src/provider-connections.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "  if (view.organizationId === LOCAL_ORGANIZATION_ID) return true;\n  if (view.organizationId === organizationId) return true;",
              "  if (view.organizationId === LOCAL_ORGANIZATION_ID) return true;\n  if (view.organizationId === PERSONAL_ORGANIZATION_ID) return true;\n  if (view.organizationId === organizationId) return true;",
              'provider connection Personal delegation'
          )
          path.write_text(text)

          # Project provider catalog/runtime derives first-class Connections from Context, not legacy Project allowlists.
          path = Path('src/project-provider-runtime.ts')
          text = path.read_text()
          marker = "  buildRegistry(project: ProjectDefinition): ProviderRegistry {"
          method = '''  /**
           * First-class inference Connections are inherited from the Project Context.
           * Persisted Project allowlists remain compatibility data only; they must not
           * hide Context-owned or delegated Personal Connections.
           */
          projectConnectionIds(project: ProjectDefinition, mode?: 'chat' | 'cowork'): string[] {
            const legacyCredentialIds = new Set(Object.values(project.credentialProfileIds ?? {}));
            const contextual = this.connections
              .viewsForOrganization(project.organizationId, legacyCredentialIds)
              .map((view) => view.id);
            const policy = effectiveProjectConnectionPolicy(project);
            const legacyAllowed = mode === 'chat'
              ? policy.chat.allowedConnectionIds
              : mode === 'cowork'
                ? policy.inference.allowedConnectionIds
                : unique([
                    ...policy.chat.allowedConnectionIds,
                    ...policy.inference.allowedConnectionIds
                  ]);
            const legacyCustom = legacyAllowed.filter((connectionId) =>
              connectionId !== 'ollama' &&
              connectionId !== this.localProvider?.id &&
              !this.connections.handles(connectionId)
            );
            return unique([
              ...(this.localProvider ? [this.localProvider.id] : []),
              ...contextual,
              ...legacyCustom
            ]);
          }

'''
          if '  projectConnectionIds(project: ProjectDefinition' not in text:
              if marker not in text:
                  raise SystemExit('projectConnectionIds marker not found')
              text = text.replace(marker, method + marker, 1)

          old = '''    const providers: InferenceProvider[] = [];
            const legacyCredentialIds = new Set(Object.values(project.credentialProfileIds ?? {}));
            const policy = effectiveProjectConnectionPolicy(project);
            const connectionIds = unique([
              ...policy.inference.allowedConnectionIds,
              ...policy.chat.allowedConnectionIds
            ]);
          '''
          new = '''    const providers: InferenceProvider[] = [];
            const legacyCredentialIds = new Set(Object.values(project.credentialProfileIds ?? {}));
            const connectionIds = this.projectConnectionIds(project);
          '''
          text = replace_once(text, old, new, 'buildRegistry connection ids')
          text = replace_once(text, "      this.assertConnectionFamilyAllowed(project, connectionId);\n", "", 'remove first-class family gate')
          text = replace_once(
              text,
              "        if (!this.localProvider || !project.privacy.allowedProviderIds.includes('ollama')) continue;",
              "        if (!this.localProvider) continue;",
              'local Context gate'
          )
          text = replace_once(
              text,
              '''      if (this.connections.handles(connectionId)) {
                providers.push(this.connections.providerForProject(connectionId, project.organizationId, legacyCredentialIds));
                continue;
              }
          ''',
              '''      if (this.connections.handles(connectionId)) {
                const view = this.connections.view(connectionId);
                if (!view?.available) continue;
                providers.push(this.connections.providerForProject(connectionId, project.organizationId, legacyCredentialIds));
                continue;
              }
          ''',
              'first-class unavailable connection handling'
          )

          # Chat defaults may fall back to the first effective Context-visible connection.
          old = '''  async projectChatSelection(project: ProjectDefinition): Promise<ModelSelection> {
            const policy = effectiveProjectConnectionPolicy(project);
            const connectionId = policy.chat.defaultConnectionId;
            if (!connectionId) throw new Error(`Project ${project.id} has no default Chat connection.`);
            if (!policy.chat.allowedConnectionIds.includes(connectionId)) {
              throw new Error(`Project ${project.id} default Chat connection is outside its Chat allowlist.`);
            }
            this.assertConnectionFamilyAllowed(project, connectionId);
            const legacyCredentialIds = new Set(Object.values(project.credentialProfileIds ?? {}));
            let provider: InferenceProvider;
            if (connectionId === (this.localProvider?.id ?? 'ollama') || connectionId === 'ollama') {
              if (!this.localProvider) throw new Error('Local inference is not configured.');
              provider = this.governed(this.localProvider);
            } else if (this.connections.handles(connectionId)) {
              provider = this.connections.providerForProject(connectionId, project.organizationId, legacyCredentialIds);
            } else {
              const registry = this.buildRegistry(project);
              if (!registry.has(connectionId)) throw new Error(`Project Chat connection is unavailable: ${connectionId}`);
              provider = registry.get(connectionId);
            }
            const settings = this.settings.get(this.settingsKey(connectionId)) ?? defaultSettings();
            const models = await provider.listModels();
            const inheritedModel = project.defaultModel.mode === 'explicit' && project.defaultModel.providerId === connectionId
              ? project.defaultModel.modelId
              : project.defaultModel.mode === 'local-first' && connectionId === 'ollama'
                ? project.defaultModel.modelId
                : undefined;
            const modelId = unique([policy.chat.defaultModelId, inheritedModel, settings.defaultModelId, models[0]?.id])[0];
            if (!modelId || !models.some((model) => model.id === modelId)) {
              throw new Error(`Project ${project.id} default Chat connection ${connectionId} has no available model.`);
            }
            return { mode: 'explicit', providerId: connectionId, modelId };
          }
          '''
          new = '''  async projectChatSelection(project: ProjectDefinition): Promise<ModelSelection> {
            const policy = effectiveProjectConnectionPolicy(project);
            const registry = this.buildRegistry(project);
            const allowed = this.projectConnectionIds(project, 'chat');
            const connectionId = unique([
              policy.chat.defaultConnectionId,
              ...allowed
            ]).find((candidate) => Boolean(candidate) && registry.has(candidate!));
            if (!connectionId) throw new Error(`Project ${project.id} has no available Chat connection.`);
            const provider = registry.get(connectionId);
            const settings = this.settings.get(this.settingsKey(connectionId)) ?? defaultSettings();
            const models = await provider.listModels();
            const inheritedModel = project.defaultModel.mode === 'explicit' && project.defaultModel.providerId === connectionId
              ? project.defaultModel.modelId
              : project.defaultModel.mode === 'local-first' && connectionId === 'ollama'
                ? project.defaultModel.modelId
                : undefined;
            const policyModel = connectionId === policy.chat.defaultConnectionId
              ? policy.chat.defaultModelId
              : undefined;
            const modelId = unique([policyModel, inheritedModel, settings.defaultModelId, models[0]?.id])[0];
            if (!modelId || !models.some((model) => model.id === modelId)) {
              throw new Error(`Project ${project.id} Chat connection ${connectionId} has no available model.`);
            }
            return { mode: 'explicit', providerId: connectionId, modelId };
          }
          '''
          text = replace_once(text, old, new, 'project Chat default selection')
          text = replace_once(
              text,
              "    assertProjectProviderAllowed(project, providerId, provider.kind);",
              "    if (!this.connections.handles(providerId)) assertProjectProviderAllowed(project, providerId, provider.kind);",
              'modelDefinition Context gate'
          )
          old = '''    const allowedConnections = new Set(
              options.connectionScope === 'chat' ? policy.chat.allowedConnectionIds : policy.inference.allowedConnectionIds
            );
          '''
          new = '''    const allowedConnections = new Set(
              this.projectConnectionIds(project, options.connectionScope === 'chat' ? 'chat' : 'cowork')
            );
          '''
          text = replace_once(text, old, new, 'routing Context connection scope')
          path.write_text(text)

          # Project Admin returns an effective Context-derived policy to the UI without persisting the derived list.
          path = Path('src/project-admin.ts')
          text = path.read_text()
          old = '''    const providers: ProjectCatalogProvider[] = [];
            const allConnectionIds = unique([
              ...policy.chat.allowedConnectionIds,
              ...policy.inference.allowedConnectionIds
            ]);
          '''
          new = '''    const providers: ProjectCatalogProvider[] = [];
            const chatConnectionIds = this.providerRuntime.projectConnectionIds(project, 'chat');
            const coworkConnectionIds = this.providerRuntime.projectConnectionIds(project, 'cowork');
            const allConnectionIds = unique([...chatConnectionIds, ...coworkConnectionIds]);
            policy.chat.allowedConnectionIds = [...chatConnectionIds];
            policy.inference.allowedConnectionIds = [...coworkConnectionIds];
            if (policy.chat.defaultConnectionId && !chatConnectionIds.includes(policy.chat.defaultConnectionId)) {
              policy.chat.defaultConnectionId = undefined;
              policy.chat.defaultModelId = undefined;
            }
            if (
              policy.inference.preferredConnectionId &&
              !coworkConnectionIds.includes(policy.inference.preferredConnectionId)
            ) {
              policy.inference.preferredConnectionId = undefined;
            }
          '''
          text = replace_once(text, old, new, 'Project catalog Context ids')

          old = '''    for (const connectionId of connectionIds) {
              if (connectionId === 'ollama' || connectionId === this.localProvider?.id) {
                if (!privacy.allowedProviderIds.includes('ollama')) {
                  throw new Error(`Project ${projectId} binds local connection ${connectionId}, but Ollama is not allowed.`);
                }
                continue;
              }
              const connection = this.connections.view(connectionId);
              if (!connection) {
                // A custom provider may still use its legacy provider id as its exact connection id.
                if (!privacy.allowedProviderIds.includes(connectionId)) {
                  throw new Error(`Project ${projectId} references unknown connection ${connectionId}.`);
                }
                continue;
              }
              if (!privacy.allowedProviderIds.includes(connection.providerFamily)) {
                throw new Error(
                  `Project ${projectId} binds ${connection.label}, but provider family ${connection.providerFamily} is not allowed.`
                );
              }
              if (connection.providerFamily !== 'ollama' && !privacy.cloudAllowed) {
                throw new Error(`Project ${projectId} binds cloud connection ${connection.label} while cloud inference is disabled.`);
              }
              const legacyException = connection.auth === 'api-key' &&
                Boolean(connection.credentialId && legacyCredentialIds.has(connection.credentialId));
              if (
                connection.organizationId !== LOCAL_ORGANIZATION_ID &&
                connection.organizationId !== organizationId &&
                !legacyException
              ) {
                throw new Error(
                  `Project ${projectId} cannot bind ${connection.label} from organization ${connection.organizationId}.`
                );
              }
            }
          '''
          new = '''    for (const connectionId of connectionIds) {
              const connection = this.connections.view(connectionId);
              if (connection) {
                const legacyException = connection.auth === 'api-key' &&
                  Boolean(connection.credentialId && legacyCredentialIds.has(connection.credentialId));
                if (
                  connection.organizationId !== LOCAL_ORGANIZATION_ID &&
                  connection.organizationId !== PERSONAL_ORGANIZATION_ID &&
                  connection.organizationId !== organizationId &&
                  !legacyException
                ) {
                  throw new Error(
                    `Project ${projectId} cannot bind ${connection.label} from organization ${connection.organizationId}.`
                  );
                }
                continue;
              }
              if (connectionId === 'ollama' || connectionId === this.localProvider?.id) continue;
              // Legacy/custom provider ids retain the old explicit Project privacy contract.
              if (!privacy.allowedProviderIds.includes(connectionId)) {
                throw new Error(`Project ${projectId} references unknown connection ${connectionId}.`);
              }
              if (!privacy.cloudAllowed) {
                throw new Error(`Project ${projectId} binds legacy cloud provider ${connectionId} while cloud inference is disabled.`);
              }
            }
          '''
          text = replace_once(text, old, new, 'Project connection binding authorization')
          text = replace_once(
              text,
              "    if (kind === 'cloud' && !project.privacy.cloudAllowed) return 'cloud-disabled';",
              "    if (kind === 'cloud' && !this.connections.view(providerId) && !project.privacy.cloudAllowed) return 'cloud-disabled';",
              'first-class unavailable reason'
          )
          path.write_text(text)

          # Agent product runtime consumes the same effective Context-derived Connection authority in Chat and Cowork.
          path = Path('src/agent-product-runtime.ts')
          text = path.read_text()
          text = text.replace("  effectiveProjectConnectionPolicy,\n", "")
          old = '''function allowedConnectionIds(
            project: ProjectDefinition,
            mode: AgentProductInteractionMode
          ): readonly string[] {
            const policy = effectiveProjectConnectionPolicy(project);
            return mode === 'chat'
              ? policy.chat.allowedConnectionIds
              : policy.inference.allowedConnectionIds;
          }
          '''
          new = '''function allowedConnectionIds(
            project: ProjectDefinition,
            mode: AgentProductInteractionMode,
            providers: Pick<ProjectProviderRuntime, 'projectConnectionIds'>
          ): readonly string[] {
            return providers.projectConnectionIds(project, mode);
          }
          '''
          text = replace_once(text, old, new, 'Agent allowed Connection ids')
          text = replace_once(
              text,
              "  connections: ProviderConnectionRuntime\n): void {\n  for (const connectionId of allowedConnectionIds(project, mode)) {",
              "  connections: ProviderConnectionRuntime,\n  providers: Pick<ProjectProviderRuntime, 'projectConnectionIds'>\n): void {\n  for (const connectionId of allowedConnectionIds(project, mode, providers)) {",
              'auto routing Context args'
          )
          old = '''function assertProjectConnection(
            project: ProjectDefinition,
            mode: AgentProductInteractionMode,
            connection: ProviderConnectionView
          ): void {
            const policy = effectiveProjectConnectionPolicy(project);
            const allowed = mode === 'chat'
              ? policy.chat.allowedConnectionIds
              : policy.inference.allowedConnectionIds;
            if (!allowed.includes(connection.id)) {
              throw new Error(
                `Connection ${connection.id} is not allowed for ${mode} in Project ${project.id}.`
              );
            }
            if (!project.privacy.allowedProviderIds.includes(connection.providerFamily)) {
              throw new Error(
                `Provider family ${connection.providerFamily} is not allowed by Project ${project.id}.`
              );
            }
            if (connection.providerFamily !== 'ollama' && !project.privacy.cloudAllowed) {
              throw new Error(
                `Project ${project.id} does not allow cloud provider ${connection.providerFamily}.`
              );
            }
          }
          '''
          new = '''function assertProjectConnection(
            project: ProjectDefinition,
            mode: AgentProductInteractionMode,
            connection: ProviderConnectionView,
            providers: Pick<ProjectProviderRuntime, 'projectConnectionIds'>
          ): void {
            if (!allowedConnectionIds(project, mode, providers).includes(connection.id)) {
              throw new Error(
                `Connection ${connection.id} is not visible to ${mode} in Project ${project.id}'s Context.`
              );
            }
          }
          '''
          text = replace_once(text, old, new, 'Agent Project Connection assertion')
          text = replace_once(
              text,
              "      this.options.connections\n    );",
              "      this.options.connections,\n      this.options.providers\n    );",
              'auto routing call'
          )
          text = text.replace(
              "if (project) assertProjectConnection(project, 'chat', connection);",
              "if (project) assertProjectConnection(project, 'chat', connection, this.options.providers);"
          )
          text = text.replace(
              "if (project) assertProjectConnection(project, mode, connection);",
              "if (project) assertProjectConnection(project, mode, connection, this.options.providers);"
          )
          path.write_text(text)

          # Canonical session scope permits a Personal inference identity inside an explicit Company Project.
          path = Path('src/agent-runtime/session-context.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import type { CompanyContextSnapshot } from '../company-context.js';",
              "import { PERSONAL_COMPANY_ID, type CompanyContextSnapshot } from '../company-context.js';",
              'session Personal import'
          )
          old = '''  if (connectionOwner !== null && connectionOwner !== companyId) {
              throw new Error(
                `Connection ${input.connection.id} belongs to Company ${connectionOwner}, not selected Company ${companyId}.`
              );
            }
          '''
          new = '''  const delegatedPersonalConnection =
              Boolean(input.project) &&
              companyId !== PERSONAL_COMPANY_ID &&
              connectionOwner === PERSONAL_COMPANY_ID;
            if (connectionOwner !== null && connectionOwner !== companyId && !delegatedPersonalConnection) {
              throw new Error(
                `Connection ${input.connection.id} belongs to Company ${connectionOwner}, not selected Company ${companyId}.`
              );
            }
          '''
          text = replace_once(text, old, new, 'session Personal delegation')
          path.write_text(text)

          # Update the ownership regression: Personal can be delegated downstream; sibling Companies cannot.
          path = Path('test/project-connection-boundaries.test.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "test('Project connections deny personal and cross-organization accounts', () => {",
              "test('Project connections allow delegated Personal identities but deny sibling Companies', () => {",
              'boundary test name'
          )
          old = '''  assert.equal(runtime.providerForProject(acmeId, 'acme').id, acmeId);
            assert.throws(
              () => runtime.providerForProject(claudeAccountConnectionId('personal'), 'acme'),
              /belongs to organization personal, not Project organization acme/
            );
            assert.throws(
          '''
          new = '''  assert.equal(runtime.providerForProject(acmeId, 'acme').id, acmeId);
            assert.equal(
              runtime.providerForProject(claudeAccountConnectionId('personal'), 'acme').id,
              claudeAccountConnectionId('personal')
            );
            assert.throws(
          '''
          text = replace_once(text, old, new, 'boundary Personal assertion')
          path.write_text(text)

          # Add an end-to-end Project catalog/runtime regression for the exact bug.
          Path('test/project-context-connection-inheritance.test.ts').write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { test } from 'node:test';

          import { ClaudeAccountProfileStore } from '../src/claude-account-profiles.js';
          import { CodexAccountProfileStore } from '../src/codex-account-profiles.js';
          import { CredentialManager, CredentialProfileStore } from '../src/credential-store.js';
          import { PricingStore } from '../src/pricing-store.js';
          import { ProjectAdminService } from '../src/project-admin.js';
          import { ProjectProviderRuntime } from '../src/project-provider-runtime.js';
          import { ProviderConnectionRuntime, apiCredentialConnectionId } from '../src/provider-connections.js';
          import { ProviderSettingsStore } from '../src/provider-settings.js';
          import { ProjectStore } from '../src/project-store.js';
          import type { InferenceProvider, ProviderCapabilities } from '../src/providers/types.js';
          import type { SecretStore } from '../src/secret-store.js';
          import { UsageLedger } from '../src/usage-ledger.js';
          import { WorkHubSourceStore } from '../src/work-hub.js';

          const capabilities: ProviderCapabilities = {
            modelDiscovery: true,
            streaming: false,
            structuredOutput: true,
            reasoning: true,
            promptCaching: false,
            toolUse: true
          };

          function temp(prefix: string): string {
            return fs.mkdtempSync(path.join(os.tmpdir(), prefix));
          }

          class MemorySecretStore implements SecretStore {
            readonly backend = 'macos-keychain' as const;
            readonly values = new Map<string, string>();
            isAvailable(): boolean { return true; }
            get(id: string): string | undefined { return this.values.get(id); }
            set(id: string, value: string): void { this.values.set(id, value); }
            delete(id: string): boolean { return this.values.delete(id); }
          }

          function fakeOpenAI(_apiKey: string): InferenceProvider {
            return {
              id: 'openai',
              kind: 'cloud',
              capabilities,
              async listModels() {
                return [{ providerId: 'openai', id: 'gpt-test', displayName: 'GPT Test', capabilities }];
              },
              async health() {
                return { providerId: 'openai', ok: true, checkedAt: new Date(0).toISOString(), latencyMs: 0, modelsAvailable: 1 };
              },
              async invoke(request) {
                return { providerId: 'openai', model: request.model, content: 'ok', latencyMs: 0, usage: {} };
              }
            };
          }

          test('Projects inherit Chat and Cowork Connections from Context without leaking sibling Companies', async () => {
            const root = temp('axis-project-context-connections-');
            const secrets = new MemorySecretStore();
            const credentials = new CredentialManager(
              new CredentialProfileStore(path.join(root, 'credentials.json')),
              { keychain: secrets }
            );
            credentials.addOrReplaceKeychainCredential({ id: 'personal-openai', providerId: 'openai', label: 'Personal OpenAI', secret: 'personal-secret' });
            credentials.addOrReplaceKeychainCredential({ id: 'acme-openai', providerId: 'openai', label: 'Acme OpenAI', organizationId: 'acme', secret: 'acme-secret' });
            credentials.addOrReplaceKeychainCredential({ id: 'other-openai', providerId: 'openai', label: 'Other OpenAI', organizationId: 'other', secret: 'other-secret' });

            const settings = new ProviderSettingsStore(path.join(root, 'providers.json'));
            const connections = new ProviderConnectionRuntime({
              credentials,
              settings,
              claudeProfiles: new ClaudeAccountProfileStore(path.join(root, 'claude')),
              codexProfiles: new CodexAccountProfileStore(path.join(root, 'codex')),
              apiProviderFactories: { openai: fakeOpenAI }
            });
            const providerRuntime = new ProjectProviderRuntime({
              credentials,
              settings,
              connections,
              cloudProviderFactories: { openai: fakeOpenAI }
            });
            const projects = new ProjectStore(path.join(root, 'projects.json'));
            const personalProject = projects.create({ id: 'personal-project', name: 'Personal Project', organizationId: 'personal' });
            const acmeProject = projects.create({ id: 'acme-project', name: 'Acme Project', organizationId: 'acme' });
            const admin = new ProjectAdminService({
              projects,
              credentials,
              providerSettings: settings,
              pricing: new PricingStore(path.join(root, 'pricing.json')),
              ledger: new UsageLedger(path.join(root, 'usage-ledger')),
              connections,
              providerRuntime,
              workHubSources: new WorkHubSourceStore(path.join(root, 'work-hub'))
            });

            const personalId = apiCredentialConnectionId('openai', 'personal-openai');
            const acmeId = apiCredentialConnectionId('openai', 'acme-openai');
            const otherId = apiCredentialConnectionId('openai', 'other-openai');

            assert.deepEqual(personalProject.connectionPolicy?.inference.allowedConnectionIds, ['ollama']);
            assert.deepEqual(acmeProject.connectionPolicy?.inference.allowedConnectionIds, ['ollama']);

            const personalCatalog = await admin.catalog(personalProject.id);
            assert.ok(personalCatalog.providers.some((provider) => provider.id === personalId && provider.ready));
            assert.ok(personalCatalog.connectionPolicy.chat.allowedConnectionIds.includes(personalId));
            assert.ok(personalCatalog.connectionPolicy.inference.allowedConnectionIds.includes(personalId));
            assert.equal(personalCatalog.providers.some((provider) => provider.id === acmeId), false);
            assert.equal(personalCatalog.providers.some((provider) => provider.id === otherId), false);

            const acmeCatalog = await admin.catalog(acmeProject.id);
            assert.ok(acmeCatalog.providers.some((provider) => provider.id === personalId && provider.ready));
            assert.ok(acmeCatalog.providers.some((provider) => provider.id === acmeId && provider.ready));
            assert.equal(acmeCatalog.providers.some((provider) => provider.id === otherId), false);
            assert.ok(acmeCatalog.connectionPolicy.chat.allowedConnectionIds.includes(personalId));
            assert.ok(acmeCatalog.connectionPolicy.chat.allowedConnectionIds.includes(acmeId));
            assert.ok(acmeCatalog.connectionPolicy.inference.allowedConnectionIds.includes(personalId));
            assert.ok(acmeCatalog.connectionPolicy.inference.allowedConnectionIds.includes(acmeId));

            const direct = await providerRuntime.modelDefinition(personalProject, personalId, 'gpt-test');
            assert.equal(direct?.model.id, 'gpt-test');

            const routed = await providerRuntime.routingCandidates(acmeProject, {
              stage: 'implementation',
              connectionScope: 'cowork',
              modelSelection: { mode: 'explicit', providerId: personalId, modelId: 'gpt-test' }
            });
            assert.ok(routed.candidates.some((candidate) =>
              candidate.providerId === personalId && candidate.modelId === 'gpt-test' && candidate.available
            ));
            assert.equal(routed.candidates.some((candidate) => candidate.providerId === otherId), false);
          });
          '''.replace(/^          /gm, ''))

          # Bump release metadata for PR CI.
          path = Path('package.json')
          text = path.read_text()
          text = replace_once(text, '"version": "0.24.1"', '"version": "0.24.2"', 'package version')
          path.write_text(text)

          path = Path('CHANGELOG.md')
          text = path.read_text()
          section = '''## [0.24.2] - 2026-09-04

          ### Fixed
          - Project model catalogs now inherit first-class inference Connections from the owning Context instead of treating legacy Project allowlists as the source of truth.
          - Personal Connections are available in Personal Projects and are reusable from Company Projects, while sibling Company Connections remain isolated.
          - Project Chat and Cowork receive the same Context-derived Connection visibility; mode differences remain capability concerns rather than Connection ownership boundaries.

          ### Security
          - Delegating a Personal inference identity into a Company Project preserves the Project's canonical Company scope and never re-homes the Connection or permits sibling-Company access.

          '''.replace('          ', '')
          text = replace_once(text, '## [0.24.1] - 2026-09-03', section + '## [0.24.1] - 2026-09-03', 'changelog version')
          path.write_text(text)
          PY
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install
      - name: Build and test
        run: npm run check
